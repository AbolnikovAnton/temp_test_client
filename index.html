<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Anton Abolnikov CoPilot</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (err) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-content">
          <div class="sidebar-header">
            <div>
              <p class="sidebar-kicker">Workspace</p>
              <h2>Chats</h2>
            </div>
            <button id="newChatBtn" class="primary-action" type="button">
              + New
            </button>
          </div>
          <div id="chatList"></div>
          <div class="usage-stats" id="usageStats">
            Spent: $0.0000<br />
            Input: 0 tokens<br />
            Output: 0 tokens
          </div>
        </div>
      </aside>

      <main class="chat-container">
        <header>
          <div class="header-title">
            <button id="burgerBtn" class="burger-btn" type="button" aria-label="Open menu">
              ☰
            </button>
            <h1>Anton Abolnikov CoPilot</h1>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">
            🌙
          </button>
        </header>

        <div id="chatBox" class="chat-box"></div>
        <div id="typing" class="typing-indicator hidden" role="status">
          Assistant is typing...
        </div>
        <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

        <div class="input-container">
          <textarea
            id="userInput"
            maxlength="10000"
            placeholder="Write a message..."
          ></textarea>
          <div class="char-counter"><span id="charCount">0</span> / 10000</div>
          <button id="sendBtn" type="button">Send</button>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
